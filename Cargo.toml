[package]
name = "pump-curve"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
description = "Decode pump.fun bonding curves and quote buys and sells with exact integer math. Zero dependencies, no_std."
license = "MIT"
authors = ["Blix <https://blixvip.com>"]
repository = "https://github.com/blixvip/pump-curve-rs"
homepage = "https://blixvip.com"
documentation = "https://docs.rs/pump-curve"
readme = "README.md"
keywords = ["solana", "pumpfun", "bonding-curve", "memecoin", "no-std"]
categories = ["cryptography::cryptocurrencies", "no-std", "parser-implementations"]
exclude = ["assets/", "VERIFY.md"]

[features]
default = ["std"]
# Implements std::error::Error for Error. Everything else works without it.
std = []

[dependencies]

[[example]]
name = "quote"
required-features = ["std"]

[[example]]
name = "bonding_curve_formula"
required-features = ["std"]

[[example]]
name = "price_market_cap"
required-features = ["std"]

[[example]]
name = "live_quote"
required-features = ["std"]

[[example]]
name = "cross_check"
required-features = ["std"]
